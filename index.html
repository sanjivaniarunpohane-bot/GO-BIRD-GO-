<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a2b3c">
<title>GO BIRD GO - DIRECTED BY MR. NIRMIT</title>

<style>
*{box-sizing:border-box;touch-action:manipulation;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;
background:#0f172a;color:white;font-family:Arial,sans-serif}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:16px;left:16px;right:16px;
display:flex;justify-content:space-between;align-items:center;
pointer-events:none;z-index:4}
.panel{background:#0f172acc;border:2px solid #38bdf888;
border-radius:16px;padding:8px 16px;font-weight:bold;
box-shadow:0 0 20px #38bdf833;backdrop-filter:blur(4px)}
.label{font-size:10px;letter-spacing:2px;color:#38bdf8}
.val{font-size:20px;color:#fff}
#audioToggle{pointer-events:auto;background:#0f172acc;border:2px solid #38bdf888;
color:#fff;border-radius:50%;width:42px;height:42px;font-size:18px;
cursor:pointer;display:flex;align-items:center;justify-content:center}

#intro{position:fixed;inset:0;background:#030712;z-index:10;
display:flex;flex-direction:column;align-items:center;justify-content:center;
animation:introFade 3.2s forwards;pointer-events:none}
#intro h1{font-size:clamp(38px,10vw,72px);letter-spacing:6px;
text-align:center;animation:titleAnim 2.6s forwards;margin:0}
#intro h1 span{color:#4ade80}
#director{margin-top:16px;font-size:13px;letter-spacing:4px;
color:#94a3b8;animation:creditAnim 2.7s forwards}

@keyframes titleAnim{0%{opacity:0;transform:scale(1.15)}20%,80%{opacity:1}100%{opacity:0;transform:scale(0.95)}}
@keyframes creditAnim{0%,35%{opacity:0}55%,80%{opacity:1}100%{opacity:0}}
@keyframes introFade{0%,85%{opacity:1}100%{opacity:0;visibility:hidden}}

#menu{position:fixed;inset:0;z-index:5;display:none;
align-items:center;justify-content:center;padding:16px;
background:#030712d9;backdrop-filter:blur(6px)}
.card{width:min(400px,100%);max-height:94vh;overflow:auto;
text-align:center;padding:28px 22px;border-radius:28px;
border:2px solid #4ade8088;
background:linear-gradient(160deg,#1e293bf7,#0f172af7);
box-shadow:0 0 45px #4ade8022}
.logo{font-size:11px;letter-spacing:4px;color:#4ade80}
h2{font-size:clamp(36px,9vw,50px);margin:12px 0 6px}
h2 span{color:#4ade80}
p{font-size:14px;line-height:1.5;color:#cbd5e1}
.stats{display:flex;justify-content:space-around;margin:18px 0;
background:#ffffff0a;padding:12px;border-radius:16px;border:1px solid #ffffff15}
.stat-box{font-weight:bold}
.stat-box small{display:block;font-size:10px;color:#94a3b8;letter-spacing:1px}
button.play-btn{border:0;border-radius:30px;padding:16px 32px;
font-size:18px;font-weight:bold;color:#030712;
background:linear-gradient(90deg,#4ade80,#22c55e);
box-shadow:0 0 25px #4ade8066;cursor:pointer;min-width:200px;
transition:transform 0.1s}
button.play-btn:active{transform:scale(0.96)}
.credit{font-size:11px;letter-spacing:3px;color:#64748b;margin-top:20px}
</style>
</head>

<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel">
    <div class="label">SCORE</div>
    <div id="score" class="val">0</div>
  </div>
  <button id="audioToggle">🔊</button>
  <div class="panel" style="text-align:right">
    <div class="label">BEST</div>
    <div id="highScore" class="val">0</div>
  </div>
</div>

<div id="intro">
  <h1>GO <span>BIRD</span> GO</h1>
  <div id="director">DIRECTED BY MR. NIRMIT</div>
</div>

<div id="menu">
  <div class="card">
    <div class="logo">ARCADE EDITION</div>
    <h2 id="title">GO <span>BIRD</span> GO</h2>
    <p id="description">Tap screen or press spacebar to flap wings, collect golden stars, and dodge obstacles!</p>
    <div class="stats">
      <div class="stat-box"><small>SCORE</small><span id="finalScore">0</span></div>
      <div class="stat-box"><small>BEST</small><span id="finalBest">0</span></div>
      <div class="stat-box"><small>STARS</small><span id="finalStars">0</span></div>
    </div>
    <button id="start" class="play-btn">START FLYING ▶</button>
    <div class="credit">DIRECTED BY MR. NIRMIT</div>
  </div>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const startBtn = document.getElementById("start");
const audioToggleBtn = document.getElementById("audioToggle");

let W, H, DPR;
let running = false;
let last = 0;
let score = 0;
let highScore = localStorage.getItem("gobird_high") || 0;
let totalStarsCollected = 0;

let audioMuted = false;
let audioCtx = null;
let musicGain = null;
let musicTimer = null;
let musicStep = 0;

function initAudio() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext();

  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.04;
  musicGain.connect(audioCtx.destination);
  scheduleMusicLoop();
}

function scheduleMusicLoop() {
  if (!audioCtx) return;
  const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
  const scale = [0, 2, 4, 7, 4, 2, 0, 4];
  
  function nextNote() {
    if (!running || audioMuted || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      const freq = notes[scale[musicStep % scale.length]];
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(audioMuted ? 0 : 0.035, audioCtx.currentTime + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
      
      osc.connect(gain);
      gain.connect(musicGain);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.55);
      
      musicStep++;
    } catch(e){}
  }
  
  musicTimer = setInterval(nextNote, 400);
}

function playSound(type) {
  if (!audioCtx || audioMuted) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === "flap") {
      osc.type = "triangle";
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === "star") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(1400, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === "hit") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    }
  } catch(e){}
}

audioToggleBtn.addEventListener("click", () => {
  audioMuted = !audioMuted;
  audioToggleBtn.textContent = audioMuted ? "🔇" : "🔊";
  if (musicGain && audioCtx) {
    musicGain.gain.setValueAtTime(audioMuted ? 0 : 0.04, audioCtx.currentTime);
  }
});

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const bird = {
  x: 0, y: 0, r: 24, vy: 0, gravity: 1200, jump: -390, rot: 0, wingTimer: 0
};

let pipes = [];
let stars = [];
let particles = [];
let spawnTimer = 0;
let bgClouds = [];

function initBgClouds() {
  bgClouds = Array.from({length: 6}, () => ({
    x: Math.random() * W,
    y: Math.random() * H * 0.5,
    speed: 15 + Math.random() * 25,
    r: 30 + Math.random() * 40
  }));
}
initBgClouds();

function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

  running = true;
  score = 0;
  totalStarsCollected = 0;
  spawnTimer = 0;
  pipes = [];
  stars = [];
  particles = [];

  bird.x = W * 0.26;
  bird.y = H * 0.45;
  bird.vy = 0;
  bird.rot = 0;

  document.getElementById("score").textContent = score;
  document.getElementById("highScore").textContent = highScore;
  menu.style.display = "none";
  last = performance.now();
  requestAnimationFrame(loop);
}

startBtn.addEventListener("click", startGame);

function gameOver() {
  running = false;
  playSound("hit");
  if (score > highScore) {
    highScore = score;
    localStorage.setItem("gobird_high", highScore);
  }
  document.getElementById("finalScore").textContent = score;
  document.getElementById("finalBest").textContent = highScore;
  document.getElementById("finalStars").textContent = totalStarsCollected;
  menu.style.display = "flex";
}

function flap() {
  if (!running) return;
  bird.vy = bird.jump;
  playSound("flap");
  
  for (let i = 0; i < 5; i++) {
    particles.push({
      x: bird.x - 15, y: bird.y + (Math.random()*10 - 5),
      vx: -60 - Math.random()*50, vy: (Math.random()-0.5)*40,
      life: 0.3, maxLife: 0.3, color: "#ffffffa"), r: 2 + Math.random()*3
    });
  }
}

window.addEventListener("keydown", e => { if (e.code === "Space" || e.code === "ArrowUp") flap(); });
window.addEventListener("touchstart", e => { if(e.target !== audioToggleBtn) flap(); }, {passive:true});
window.addEventListener("mousedown", e => { if(e.target !== audioToggleBtn) flap(); });

function drawGreenBird(x, y, r, rot, wingState) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);

  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath();
  ctx.ellipse(2, r * 0.85, r * 0.7, r * 0.25, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#3f8d16";
  ctx.beginPath();
  ctx.ellipse(-r*0.2, -r*0.9, r*0.25, r*0.4, -0.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#1b3c08";
  ctx.stroke();

  ctx.fillStyle = "#86efac";
  ctx.beginPath();
  ctx.ellipse(-r*0.22, -r*0.9, r*0.14, r*0.28, -0.35, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#a3e635";
  ctx.beginPath();
  ctx.ellipse(-r*0.4, r*0.2, r*0.35, r*0.2, 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#d97706";
  ctx.fillRect(-r*0.2, r*0.8, 5, 10);
  ctx.fillRect(r*0.1, r*0.8, 5, 10);

  const grad = ctx.createRadialGradient(-r*0.2, -r*0.2, r*0.1, 0, 0, r);
  grad.addColorStop(0, "#a3e635");
  grad.addColorStop(0.7, "#65a30d");
  grad.addColorStop(1, "#3f6212");

  ctx.fillStyle = grad;
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#1b3c08";
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  const wingY = Math.sin(wingState) * 12;
  ctx.save();
  ctx.translate(-r*0.2, r*0.1);
  ctx.rotate(wingY * 0.05);
  ctx.fillStyle = "#84cc16";
  ctx.beginPath();
  ctx.ellipse(-r*0.1, wingY*0.5, r*0.55, r*0.38, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(r * 0.28, -r * 0.15, r * 0.42, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#0f172a";
  ctx.beginPath();
  ctx.arc(r * 0.38, -r * 0.15, r * 0.25, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(r * 0.45, -r * 0.25, r * 0.08, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fbbf24";
  ctx.beginPath();
  ctx.moveTo(r * 0.45, -r * 0.12);
  ctx.lineTo(r * 1.05, r * 0.08);
  ctx.lineTo(r * 0.35, r * 0.35);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#0f172a";
  ctx.beginPath();
  ctx.arc(r * 0.52, r * 0.08, r * 0.16, 0, Math.PI);
  ctx.fill();

  ctx.restore();
}

function spawnPipePair() {
  const gap = Math.max(150, H * 0.28);
  const minTop = 60;
  const maxTop = H - gap - 120;
  const topH = minTop + Math.random() * (maxTop - minTop);
  const w = 68;

  pipes.push({
    x: W + 10,
    topH: topH,
    bottomY: topH + gap,
    w: w,
    passed: false
  });

  if (Math.random() < 0.7) {
    stars.push({
      x: W + 10 + w / 2,
      y: topH + gap / 2 + (Math.random() * 40 - 20),
      r: 14,
      collected: false,
      spin: 0
    });
  }
}

function drawPipe(x, y, w, h, isTop) {
  const pipeGrad = ctx.createLinearGradient(x, 0, x + w, 0);
  pipeGrad.addColorStop(0, "#15803d");
  pipeGrad.addColorStop(0.3, "#4ade80");
  pipeGrad.addColorStop(0.7, "#22c55e");
  pipeGrad.addColorStop(1, "#14532d");

  ctx.fillStyle = pipeGrad;
  ctx.strokeStyle = "#052e16";
  ctx.lineWidth = 3;

  ctx.fillRect(x, y, w, h);
  ctx.strokeRect(x, y, w, h);

  const capH = 26;
  const capW = w + 12;
  const capX = x - 6;
  const capY = isTop ? y + h - capH : y;

  ctx.fillRect(capX, capY, capW, capH);
  ctx.strokeRect(capX, capY, capW, capH);
}

function drawStar(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.spin);

  ctx.shadowBlur = 15;
  ctx.shadowColor = "#fbbf24";
  ctx.fillStyle = "#f59e0b";
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * s.r,
               -Math.sin((18 + i * 72) * Math.PI / 180) * s.r);
    ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (s.r * 0.5),
               -Math.sin((54 + i * 72) * Math.PI / 180) * (s.r * 0.5));
  }
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function update(dt) {
  bird.vy += bird.gravity * dt;
  bird.y += bird.vy * dt;
  bird.rot = Math.max(-0.4, Math.min(Math.PI * 0.45, bird.vy * 0.0018));
  bird.wingTimer += dt * 15;

  if (bird.y + bird.r >= H - 40 || bird.y - bird.r <= 0) {
    gameOver();
    return;
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = 1.65;
    spawnPipePair();
  }

  const speed = 180;

  for (let p of pipes) {
    p.x -= speed * dt;

    if (!p.passed && p.x + p.w < bird.x) {
      p.passed = true;
      score++;
      document.getElementById("score").textContent = score;
    }

    if (bird.x + bird.r - 4 > p.x && bird.x - bird.r + 4 < p.x + p.w) {
      if (bird.y - bird.r + 4 < p.topH || bird.y + bird.r - 4 > p.bottomY) {
        gameOver();
        return;
      }
    }
  }

  for (let s of stars) {
    s.x -= speed * dt;
    s.spin += dt * 3;

    if (!s.collected) {
      const dist = Math.hypot(bird.x - s.x, bird.y - s.y);
      if (dist < bird.r + s.r) {
        s.collected = true;
        totalStarsCollected++;
        score += 2;
        playSound("star");
        document.getElementById("score").textContent = score;

        for (let i = 0; i < 8; i++) {
          particles.push({
            x: s.x, y: s.y,
            vx: (Math.random() - 0.5) * 180, vy: (Math.random() - 0.5) * 180,
            life: 0.4, maxLife: 0.4, color: "#fbbf24", r: 3
          });
        }
      }
    }
  }

  bgClouds.forEach(c => {
    c.x -= c.speed * dt;
    if (c.x + c.r < 0) c.x = W + c.r;
  });

  particles.forEach(pt => {
    pt.life -= dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
  });

  pipes = pipes.filter(p => p.x + p.w > -20);
  stars = stars.filter(s => s.x + s.r > -20 && !s.collected);
  particles = particles.filter(pt => pt.life > 0);
}

function render() {
  ctx.clearRect(0, 0, W, H);

  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#0f172a");
  sky.addColorStop(0.6, "#1e293b");
  sky.addColorStop(1, "#0f172a");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#ffffff08";
  bgClouds.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();
  });

  pipes.forEach(p => {
    drawPipe(p.x, 0, p.w, p.topH, true);
    drawPipe(p.x, p.bottomY, p.w, H - p.bottomY, false);
  });

  stars.forEach(drawStar);

  particles.forEach(pt => {
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  drawGreenBird(bird.x, bird.y, bird.r, bird.rot, bird.wingTimer);

  ctx.fillStyle = "#022c22";
  ctx.fillRect(0, H - 36, W, 36);
  ctx.fillStyle = "#4ade80";
  ctx.fillRect(0, H - 36, W, 6);
}

function loop(now) {
  if (!running) return;
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;

  update(dt);
  render();
  requestAnimationFrame(loop);
}

render();

setTimeout(() => {
  const intro = document.getElementById("intro");
  if (intro) intro.remove();
  menu.style.display = "flex";
}, 3100);

})();
</script>
</body>
</html>
